<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tablero de tareas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg-1:#0b0e1a;
    --bg-2:#12172b;
    --surface: rgba(255,255,255,0.045);
    --surface-hover: rgba(255,255,255,0.075);
    --border: rgba(255,255,255,0.09);
    --text: #eef1fb;
    --text-dim: #9099b8;
    --blue:#4f8cff;
    --violet:#9f7bff;
    --mint:#3ddc97;
    --amber:#ffb454;
    --rust:#ff6b6b;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(79,140,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(159,123,255,0.14), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(61,220,151,0.08), transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment:fixed;
    min-height:100vh;
    padding:36px 24px 70px;
  }

  .glow-orb{
    position:fixed; width:480px; height:480px; border-radius:50%;
    filter:blur(90px); opacity:0.16; z-index:0; pointer-events:none;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .glow-orb.a{ background:var(--blue); top:-140px; left:-140px; }
  .glow-orb.b{ background:var(--violet); bottom:-160px; right:-120px; animation-delay:-6s; }
  @keyframes drift{ 0%{transform:translate(0,0);} 100%{transform:translate(40px,30px);} }

  header, .composer, .status-line, .board, .layout{ position:relative; z-index:1; }

  .layout{
    max-width:1040px; margin:0 auto;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:28px;
    align-items:start;
  }
  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
  }

  header{ margin:0 0 22px; }
  header h1{
    font-family:'Sora', sans-serif; font-weight:700; font-size:1.9rem; letter-spacing:-0.01em;
    background:linear-gradient(90deg, #ffffff, #b9c4ee 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .composer{
    margin:0 0 20px;
    background:var(--surface); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:16px;
    padding:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .composer .full{ grid-column:1 / -1; }
  .composer label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:0.66rem;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:5px;
  }
  .composer input, .composer select, .composer textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px;
    background:rgba(255,255,255,0.03); color:var(--text);
    font-family:'Inter', sans-serif; font-size:0.85rem;
  }
  .composer select option{ background:#161c30; color:var(--text); }
  .composer textarea{ resize:vertical; min-height:52px; font-family:'Inter', sans-serif; }
  .composer input:focus, .composer select:focus, .composer textarea:focus{
    outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(79,140,255,0.18);
  }
  .composer select{ appearance:none; cursor:pointer; }
  .composer button{
    grid-column:1 / -1;
    padding:12px; border:none; border-radius:9px; margin-top:4px;
    background:linear-gradient(90deg, var(--blue), var(--violet));
    color:#fff; font-family:'Sora', sans-serif; font-weight:600; font-size:0.85rem;
    cursor:pointer; transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .composer button:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(79,140,255,0.35); }

  .status-line{
    margin:0 0 20px;
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--text-dim);
    display:flex; justify-content:space-between;
  }

  .board{ display:flex; flex-direction:column; gap:18px; }

  .sidebar{ position:sticky; top:24px; display:flex; flex-direction:column; gap:14px; }
  .sidebar .panel{
    background:var(--surface); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:16px; padding:16px;
  }
  .sidebar h3{
    font-family:'Sora', sans-serif; font-weight:600; font-size:0.85rem;
    display:flex; align-items:center; gap:6px; margin-bottom:12px;
  }
  .sidebar .alert-list{ display:flex; flex-direction:column; gap:8px; }
  .alert-item{
    display:block; padding:10px 11px; border-radius:10px;
    border:1px solid var(--border); background:rgba(255,255,255,0.03);
    font-size:0.78rem;
  }
  .alert-item .a-tarea{ font-family:'Sora', sans-serif; font-weight:600; font-size:0.82rem; margin-bottom:3px; }
  .alert-item .a-materia{
    font-family:'JetBrains Mono', monospace; font-size:0.62rem; text-transform:uppercase;
    letter-spacing:0.04em; color:var(--text-dim); margin-bottom:5px;
  }
  .alert-item .a-when{ font-family:'JetBrains Mono', monospace; font-size:0.7rem; }
  .alert-item.al-overdue{ border-color:rgba(255,107,107,0.5); background:rgba(255,107,107,0.07); }
  .alert-item.al-overdue .a-when{ color:var(--rust); }
  .alert-item.al-soon{ border-color:rgba(255,180,84,0.5); background:rgba(255,180,84,0.07); }
  .alert-item.al-soon .a-when{ color:var(--amber); }
  .alert-item.al-normal .a-when{ color:var(--text-dim); }
  .sidebar .empty{ font-size:0.78rem; color:var(--text-dim); opacity:0.6; font-style:italic; }

  .column{
    background:var(--surface); backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:16px; padding:18px;
  }

  .subject-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; margin-bottom:14px; padding-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .subject-head h2{
    font-family:'Sora', sans-serif; font-weight:700; font-size:1.08rem; margin-bottom:4px;
  }
  .subject-meta{
    display:flex; flex-direction:column; gap:3px;
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--text-dim);
  }
  .subject-meta a{ color:var(--blue); text-decoration:none; }
  .subject-meta a:hover{ text-decoration:underline; }
  .col-count{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--text-dim);
    background:rgba(255,255,255,0.05); padding:3px 9px; border-radius:999px;
    white-space:nowrap;
  }

  .subsection-label{
    font-family:'JetBrains Mono', monospace; font-size:0.66rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:10px;
  }

  .cards{ display:flex; flex-direction:column; gap:12px; }

  .card{
    background:rgba(255,255,255,0.035); border:1px solid var(--border); border-radius:12px;
    padding:14px 14px 12px;
    opacity:0; transform:translateY(10px); animation:rise 0.4s ease forwards;
    transition:border-color 0.2s ease, background 0.2s ease;
  }
  .card:hover{ border-color:rgba(159,123,255,0.45); background:var(--surface-hover); }
  .card.urgency-soon{ border-color:rgba(255,180,84,0.5); background:rgba(255,180,84,0.06); }
  .card.urgency-overdue{ border-color:rgba(255,107,107,0.55); background:rgba(255,107,107,0.07); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }

  .tag-urgent, .tag-soon{
    font-family:'JetBrains Mono', monospace;
    font-size:0.62rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:1px 7px;
    border-radius:999px;
    margin-left:6px;
  }
  .tag-urgent{ background:rgba(255,107,107,0.18); color:var(--rust); }
  .tag-soon{ background:rgba(255,180,84,0.18); color:var(--amber); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card .tarea{ font-family:'Sora', sans-serif; font-weight:600; font-size:0.98rem; line-height:1.35; margin-bottom:8px; }
  .card .fecha{
    display:inline-flex; align-items:center; gap:5px;
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--amber); margin-bottom:4px;
  }
  .card .countdown{
    font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--text-dim);
    margin-bottom:8px;
  }
  .card .countdown-soon{ color:var(--amber); }
  .card .countdown-overdue{ color:var(--rust); }
  .card .desc{
    font-size:0.82rem; color:var(--text-dim); line-height:1.5; white-space:pre-wrap;
    max-height:2.8em; overflow:hidden; cursor:pointer;
    border-top:1px solid var(--border); padding-top:8px;
  }
  .card .desc.expanded{ max-height:none; }
  .card .desc-toggle{
    display:inline-block; font-family:'JetBrains Mono', monospace; font-size:0.68rem;
    color:var(--violet); cursor:pointer; margin-top:6px;
  }
  .card .desc-edit-toggle{
    display:inline-block; font-family:'JetBrains Mono', monospace; font-size:0.68rem;
    color:var(--text-dim); cursor:pointer; margin-top:6px; margin-left:10px;
  }
  .card .desc-edit-toggle:hover{ color:var(--blue); }
  .card .desc-edit-toggle.add-desc{ margin-left:0; }

  .edit-desc-panel{ margin-top:6px; }
  .edit-desc-panel textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    background:rgba(255,255,255,0.04); color:var(--text);
    font-family:'Inter', sans-serif; font-size:0.82rem; resize:vertical; min-height:60px;
    margin-bottom:6px;
  }
  .edit-desc-panel .desc-actions{ display:flex; gap:6px; }
  .edit-desc-panel button{
    border:none; border-radius:6px; padding:5px 9px; cursor:pointer;
    font-family:'Sora', sans-serif; font-size:0.7rem; font-weight:600;
  }
  .edit-desc-panel .save-desc{ background:var(--blue); color:#fff; }
  .edit-desc-panel .cancel-desc{ background:rgba(255,255,255,0.06); color:var(--text-dim); }

  .card-actions{ display:flex; gap:6px; flex-shrink:0; }
  .card-actions button{
    border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text-dim);
    border-radius:7px; width:28px; height:28px; cursor:pointer; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .card-actions button:hover{ background:rgba(255,255,255,0.08); color:var(--text); }
  .card-actions .done-btn:hover{ color:var(--mint); border-color:rgba(61,220,151,0.4); }
  .card-actions .edit-btn:hover{ color:var(--blue); border-color:rgba(79,140,255,0.4); }
  .card-actions .del-btn:hover{ color:var(--rust); border-color:rgba(255,107,107,0.4); }

  .edit-fecha-row{ display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .edit-fecha-row input{
    padding:6px 8px; border:1px solid var(--border); border-radius:7px;
    background:rgba(255,255,255,0.04); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:0.72rem;
  }
  .edit-fecha-row button{
    border:none; border-radius:6px; padding:5px 9px; cursor:pointer;
    font-family:'Sora', sans-serif; font-size:0.7rem; font-weight:600;
  }
  .edit-fecha-row .save-fecha{ background:var(--blue); color:#fff; }
  .edit-fecha-row .cancel-fecha{ background:rgba(255,255,255,0.06); color:var(--text-dim); }

  .empty{ font-size:0.8rem; color:var(--text-dim); opacity:0.55; font-style:italic; }
</style>
</head>
<body>
  <div class="glow-orb a"></div>
  <div class="glow-orb b"></div>

  <header>
    <h1>Tablero de tareas</h1>
  </header>

  <div class="layout">
    <div class="main-col">
      <div class="composer">
        <div>
          <label>Materia</label>
          <select id="fMateria"></select>
        </div>
        <div>
          <label>Fecha y hora de entrega</label>
          <input type="datetime-local" id="fFecha">
        </div>
        <div class="full">
          <label>Tarea</label>
          <input type="text" id="fTarea" placeholder="Ej: Terminar modelo en openLCA">
        </div>
        <div class="full">
          <label>Descripción</label>
          <textarea id="fDesc" placeholder="Detalles, notas, lo que haga falta..."></textarea>
        </div>
        <button id="addBtn">+ Agregar tarea</button>
      </div>

      <div class="status-line">
        <span id="statusMsg">sin tareas todavía</span>
        <span id="lastUpdated"></span>
      </div>

      <div class="board" id="board"></div>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h3>⚡ Alertas</h3>
        <div class="alert-list" id="alertList"></div>
      </div>
    </aside>
  </div>

<script>
const MATERIAS = [
  { nombre: 'Mercadeo', docente: 'Juan Carlos', horario: 'LW 6-8pm', enlace: 'https://udea.zoom.us/j/96574081990' },
  { nombre: 'Amb. y Desarrollo', docente: 'Sylvia Cacua', horario: 'LW 2-4pm', enlace: 'https://udearroba.zoom.us/j/94103744298' },
  { nombre: 'Logística II', docente: 'Nora Cadavid', horario: 'LJ 4-6pm', enlace: 'https://udea.zoom.us/j/94643035588' },
  { nombre: 'Formulación y Evaluación', docente: 'Diana Betancur', horario: 'MJ 12-2pm', enlace: 'https://udearroba.zoom.us/j/93852235430?uname=MARIANA%20PINEDA%20RIOS#success' },
  { nombre: 'Admin. Producción', docente: 'Yenny Aguirre', horario: 'MJ 2-4pm', enlace: 'https://udearroba.zoom.us/j/96250153965?uname=MARIANA%20PINEDA%20RIOS#success' }
];

let tasks = [];
let refreshTimer = null;

// === CONFIGURACIÓN DE SUPABASE ===
const SUPABASE_URL = 'https://mrtrqsitbfdmqskbqfyi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RJrxYqSPyNP6_WtXM2EtRw_lch9ckQO';
// ==================================

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getUrgency(fecha){
  if(!fecha) return 'normal';
  const now = new Date();
  const due = new Date(fecha);
  const diffHours = (due - now) / 3600000;
  if(diffHours < 0) return 'overdue';
  if(diffHours <= 72) return 'soon';
  return 'normal';
}

function formatCountdown(fecha){
  if(!fecha) return '';
  const now = new Date();
  const due = new Date(fecha);
  const diffMs = due - now;
  const overdue = diffMs < 0;
  const absMs = Math.abs(diffMs);
  const days = Math.floor(absMs / 86400000);
  const hours = Math.floor((absMs % 86400000) / 3600000);
  const parts = [];
  if(days > 0) parts.push(days + 'd');
  parts.push(hours + 'h');
  return overdue ? `vencida hace ${parts.join(' ')}` : `faltan ${parts.join(' ')}`;
}

function formatFecha(fecha){
  if(!fecha) return '';
  const d = new Date(fecha);
  return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short' }) + ' · ' +
         d.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
}

function renderAlerts(pending){
  const el = document.getElementById('alertList');
  const withDate = pending
    .filter(t => t.fecha)
    .sort((a, b) => a.fecha.localeCompare(b.fecha))
    .slice(0, 8);

  if(withDate.length === 0){
    el.innerHTML = '<div class="empty">nada urgente por ahora</div>';
    return;
  }

  el.innerHTML = withDate.map(t => {
    const urgency = getUrgency(t.fecha);
    return `
      <div class="alert-item al-${urgency}">
        <div class="a-tarea">${escapeHtml(t.tarea)}</div>
        <div class="a-materia">${escapeHtml(t.materia || 'Sin materia')}</div>
        <div class="a-when">${formatCountdown(t.fecha)}</div>
      </div>`;
  }).join('');
}

function populateMateriaSelect(){
  const sel = document.getElementById('fMateria');
  sel.innerHTML = MATERIAS.map(m => `<option value="${escapeHtml(m.nombre)}">${escapeHtml(m.nombre)}</option>`).join('');
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const statusEl = document.getElementById('statusMsg');

  const pending = tasks.filter(t => !t.done);
  statusEl.textContent = pending.length + ' tarea' + (pending.length === 1 ? '' : 's') + ' pendiente' + (pending.length === 1 ? '' : 's') + ' en total';

  renderAlerts(pending);

  MATERIAS.forEach(materia => {
    const items = pending
      .filter(t => t.materia === materia.nombre)
      .sort((a, b) => {
        if(!a.fecha && !b.fecha) return 0;
        if(!a.fecha) return 1;
        if(!b.fecha) return -1;
        return a.fecha.localeCompare(b.fecha);
      });

    const section = document.createElement('div');
    section.className = 'column';
    section.innerHTML = `
      <div class="subject-head">
        <div>
          <h2>${escapeHtml(materia.nombre)}</h2>
          <div class="subject-meta">
            <span>👤 ${escapeHtml(materia.docente)}</span>
            <span>🕒 ${escapeHtml(materia.horario)}</span>
            <span>🔗 <a href="${materia.enlace}" target="_blank" rel="noopener">Enlace de clase</a></span>
          </div>
        </div>
        <span class="col-count">${items.length} pendiente${items.length === 1 ? '' : 's'}</span>
      </div>
      <div class="subsection-label">Tareas pendientes</div>
      <div class="cards"></div>`;

    const cardsEl = section.querySelector('.cards');

    if(items.length === 0){
      cardsEl.innerHTML = '<div class="empty">no hay tareas pendientes para esta materia</div>';
    } else {
      items.forEach((item, i) => {
        const card = document.createElement('div');
        const urgency = getUrgency(item.fecha);
        card.className = 'card' + (urgency !== 'normal' ? ' urgency-' + urgency : '');
        card.style.animationDelay = (i * 0.05) + 's';
        const hasDesc = item.descripcion && item.descripcion.trim();
        const urgencyTag = urgency === 'overdue' ? '<span class="tag-urgent">vencida</span>'
                          : urgency === 'soon' ? '<span class="tag-soon">próxima</span>' : '';
        const countdown = item.fecha ? formatCountdown(item.fecha) : '';
        card.innerHTML = `
          <div class="card-top">
            <div style="flex:1">
              <div class="tarea">${escapeHtml(item.tarea)}</div>
              <div class="fecha-block">
                ${item.fecha ? `<div class="fecha">▲ ${formatFecha(item.fecha)} ${urgencyTag}</div><div class="countdown ${urgency !== 'normal' ? 'countdown-' + urgency : ''}">${countdown}</div>` : '<div class="fecha" style="opacity:0.5">sin fecha</div>'}
              </div>
            </div>
            <div class="card-actions">
              <button class="done-btn" title="Marcar como hecho">✓</button>
              <button class="edit-btn" title="Editar fecha">✎</button>
              <button class="del-btn" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="desc-block">
            ${hasDesc
              ? `<div class="desc">${escapeHtml(item.descripcion)}</div><span class="desc-toggle">ver más ↓</span><span class="desc-edit-toggle">editar</span>`
              : `<span class="desc-edit-toggle add-desc">+ agregar descripción</span>`}
          </div>`;

        if(hasDesc){
          const descEl = card.querySelector('.desc');
          const toggleEl = card.querySelector('.desc-toggle');
          const toggle = () => {
            descEl.classList.toggle('expanded');
            toggleEl.textContent = descEl.classList.contains('expanded') ? 'ver menos ↑' : 'ver más ↓';
          };
          descEl.addEventListener('click', toggle);
          toggleEl.addEventListener('click', toggle);
        }

        card.querySelector('.desc-edit-toggle').addEventListener('click', () => {
          const block = card.querySelector('.desc-block');
          const currentVal = item.descripcion || '';
          block.innerHTML = `
            <div class="edit-desc-panel">
              <textarea class="desc-input" placeholder="Detalles, notas...">${escapeHtml(currentVal)}</textarea>
              <div class="desc-actions">
                <button class="save-desc">Guardar</button>
                <button class="cancel-desc">Cancelar</button>
              </div>
            </div>`;
          block.querySelector('.save-desc').addEventListener('click', () => {
            const newVal = block.querySelector('.desc-input').value.trim();
            updateDescripcion(item.id, newVal);
          });
          block.querySelector('.cancel-desc').addEventListener('click', () => render());
        });

        card.querySelector('.done-btn').addEventListener('click', () => markDone(item.id));
        card.querySelector('.del-btn').addEventListener('click', () => deleteTask(item.id));
        card.querySelector('.edit-btn').addEventListener('click', () => {
          const block = card.querySelector('.fecha-block');
          const currentVal = item.fecha || '';
          block.innerHTML = `
            <div class="edit-fecha-row">
              <input type="datetime-local" class="fecha-input" value="${escapeHtml(currentVal)}">
              <button class="save-fecha">Guardar</button>
              <button class="cancel-fecha">Cancelar</button>
            </div>`;
          block.querySelector('.save-fecha').addEventListener('click', () => {
            const newVal = block.querySelector('.fecha-input').value;
            updateFecha(item.id, newVal);
          });
          block.querySelector('.cancel-fecha').addEventListener('click', () => render());
        });

        cardsEl.appendChild(card);
      });
    }

    board.appendChild(section);
  });
}

async function loadTasks(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tasks?select=*&order=created_at.asc`, { headers });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const current = JSON.stringify(tasks);
    if(JSON.stringify(data) !== current){
      tasks = data;
      render();
    }
    document.getElementById('lastUpdated').textContent = 'sincronizado ' + new Date().toLocaleTimeString();
  } catch(e){
    document.getElementById('statusMsg').textContent = 'no se pudo conectar a la base de datos';
    console.error(e);
  }
}

async function addTask(task){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify(task)
    });
    loadTasks();
  } catch(e){ console.error(e); }
}

async function updateDescripcion(id, nuevaDescripcion){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ descripcion: nuevaDescripcion || null })
    });
    loadTasks();
  } catch(e){ console.error(e); }
}

async function updateFecha(id, nuevaFecha){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ fecha: nuevaFecha || null })
    });
    loadTasks();
  } catch(e){ console.error(e); }
}

async function markDone(id){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...headers, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ done: true })
    });
    loadTasks();
  } catch(e){ console.error(e); }
}

async function deleteTask(id){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/tasks?id=eq.${id}`, {
      method: 'DELETE',
      headers
    });
    loadTasks();
  } catch(e){ console.error(e); }
}

document.getElementById('addBtn').addEventListener('click', () => {
  const materia = document.getElementById('fMateria').value;
  const tarea = document.getElementById('fTarea').value.trim();
  const fecha = document.getElementById('fFecha').value;
  const descripcion = document.getElementById('fDesc').value.trim();
  if(!tarea){ document.getElementById('fTarea').focus(); return; }

  addTask({ materia, tarea, fecha, descripcion, done:false });

  document.getElementById('fTarea').value = '';
  document.getElementById('fFecha').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fTarea').focus();
});

populateMateriaSelect();
loadTasks();
render();
refreshTimer = setInterval(loadTasks, 8000);
setInterval(render, 60000); // actualiza los contadores de "faltan Xd Xh" cada minuto
</script>
